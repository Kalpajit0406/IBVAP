# ── Stream sources ───────────────────────────────────────────────────────────
# server.py opens every entry here on startup, alongside phones:
#   - url: rtsp://user:pass@ip:554/...   → a CCTV camera / NVR channel (pulled)
#   - url: http://ip/video.mjpg          → an MJPEG camera or IP-Webcam app
#   - url: "0" / "1"                     → a local USB/laptop webcam index
#   - url: path\to\clip.mp4              → a video file (looped) — offline testing
#   - url: ws   (or omit url)            → a slot a phone connects to via /cam/N
# `zone_sensitivity` 0.0–1.0 feeds the risk score. `enabled: false` skips a row.
# `transport` / `decode_fps` override the `cctv:` defaults per camera.
#
# ── Real CCTV: how to fill this in ──────────────────────────────────────────
# Colleges usually give you NVR access (one IP + login, several channels), not
# per-camera IPs. Use the sub-stream (low-res) for analytics. Full guide +
# vendor URL table: docs/CCTV_INTEGRATION.md. Test a URL first:
#   python rtsp_probe.py "rtsp://user:pass@10.0.0.50:554/..."
# Discover cameras on the LAN:  python discover_cameras.py
#
#   Hikvision  main : rtsp://user:pass@IP:554/Streaming/Channels/101
#              sub  : rtsp://user:pass@IP:554/Streaming/Channels/102
#              (NVR: 101/201/301… = ch1/ch2/ch3 main, 102/202… = sub)
#   Dahua/CP+  main : rtsp://user:pass@IP:554/cam/realmonitor?channel=1&subtype=0
#              sub  : rtsp://user:pass@IP:554/cam/realmonitor?channel=1&subtype=1
#   Axis            : rtsp://user:pass@IP/axis-media/media.amp?resolution=640x360
#   Uniview         : rtsp://user:pass@IP:554/media/video2      (video1=main)
#   generic ONVIF   : ask the camera via discover_cameras.py — paths vary
#
# Example — 4 NVR channels, sub-stream (delete/replace with your college's):
# streams:
#   - { id: 0, name: "Gate",     url: "rtsp://admin:pass@10.0.0.50:554/Streaming/Channels/102", zone_sensitivity: 0.9 }
#   - { id: 1, name: "Corridor", url: "rtsp://admin:pass@10.0.0.50:554/Streaming/Channels/202", zone_sensitivity: 0.6 }
#   - { id: 2, name: "Parking",  url: "rtsp://admin:pass@10.0.0.50:554/Streaming/Channels/302", zone_sensitivity: 0.7 }
#   - { id: 3, name: "Perimeter",url: "rtsp://admin:pass@10.0.0.50:554/Streaming/Channels/402", zone_sensitivity: 0.9 }

streams:
  - id: 0
    name: "Phone-0"
    url: "ws"               # phone slot — open https://<ip>:8443/cam/0
    zone_sensitivity: 0.8
  - id: 1
    name: "Phone-1"
    url: "ws"
    zone_sensitivity: 0.5

# ── CCTV / RTSP defaults ─────────────────────────────────────────────────────
# Applied to every pulled stream unless the stream overrides them.
cctv:
  transport: tcp          # tcp = reliable (recommended). udp = lower latency, tears on loss.
  decode_fps: 15          # frames actually decoded per camera. Detection is 8 fps;
                          # 10–15 is plenty and keeps CPU decode cost down with many cams.
  reconnect_delay: 3.0    # seconds to wait before retrying a dropped stream
  stall_timeout: 8.0      # no frame for this long → drop and reconnect
  open_timeout: 8.0       # give up opening a stream after this long

# ── Ingest / mobile devices ──────────────────────────────────────────────────
# A phone browser opens https://<lan-ip>:8443/camera/<id>, is asked for
# 1280x720@24, and streams JPEG frames over a WebSocket. Phones rarely honour
# the exact request, so every incoming frame is rescaled to this size before it
# reaches the pipeline — downstream code never sees a non-standard resolution.
ingest:
  normalise_width: 1280
  normalise_height: 720

# ── Model profiles (for live switching from the dashboard) ────────────────────
# Each profile overrides model.weights and pose.weights when selected.
# Switch via POST /api/switch-model {"profile": "nano"} or from the UI.
model_profiles:
  nano:
    label:         "Nano (2.6M, 40.9 mAP)"
    det_weights:   "yolo26n.pt"        # ~5.5 MB; auto-downloaded
    pose_weights:  "yolo26n-pose.pt"   # ~7.5 MB; already downloaded
    max_batch:     16
  medium:
    label:         "Medium (20.4M, 53.1 mAP)"
    det_weights:   "yolo26m.pt"        # ~42 MB; auto-downloaded
    pose_weights:  "yolo26m-pose.pt"   # ~60 MB; auto-downloaded
    max_batch:     8                   # lower batch cap for 6 GB VRAM safety

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  weights: "yolo26n.engine"   # TensorRT 10.13 FP16 engine, built for this GPU by
                          # export_engine.py. Fixed input shape (max_batch, 3, imgsz, imgsz);
                          # the detector pads short batches to it. Inference runs on its own
                          # worker thread (server.py) so the ~15-28 ms GPU call never blocks
                          # the 24 Hz muxer — measured: 8 mobile streams at 192 fps, GPU ~37%.
                          #
                          # Fall back to "yolo26n.pt" only if the .engine is missing (not
                          # yet exported on this machine) or a non-CUDA box. The .engine is
                          # hardware-specific: re-run export_engine.py per GPU. See CLAUDE.md.
  confidence: 0.40        # generic fallback bar; per-class floors below refine it
  iou: 0.50
  device: "0"             # "0" = GPU 0 (CUDA); "cpu" = CPU only (slow but works)
  image_size: 640
  half: true              # FP16 on CUDA — roughly 2x throughput on an RTX 3050

  # ── Detection scope + per-class confidence ─────────────────────────────────
  # Inference is restricted to these COCO ids (person, car, motorcycle, bus,
  # truck) — cleaner output, slightly less NMS, no "chair / handbag" boxes.
  classes: [0, 2, 3, 5, 7]
  # Then a per-class floor: a LOWER bar for people (they matter most, we want
  # recall) and a HIGHER bar for vehicles (kills parked-car / reflection FPs).
  person_conf:  0.30
  vehicle_conf: 0.40


  # ── Throughput controls ─────────────────────────────────────────────────────
  # server.py runs an nvstreammux-style muxer: every camera's queue is drained
  # continuously into a one-deep slot, and on a fixed tick (1 / stream_fps) the
  # whole set of live slots goes to the model in ONE forward pass. The batch is
  # then always "every connected camera", which is what makes the GPU cost
  # sub-linear in camera count. Measured on an RTX 3050: batch of 1 = 12.3 ms,
  # batch of 8 ≈ 18 ms — per-pass overhead dominates, so filling the batch is
  # the whole game. (The old batch_window_ms setting is obsolete — the fixed
  # tick replaced the collect-with-timeout approach.)
  max_batch: 8            # max frames per batched call. Also the TensorRT engine's
                          # dynamic-batch profile ceiling (export_engine.py reads this).
                          # 8 covers the 8-stream target; raising it needs a re-export
                          # and more VRAM during the TRT build.

  # Detection runs at detect_fps while tracks are carried on every frame by
  # linear extrapolation, so boxes stay smooth between detector passes.
  stream_fps: 24          # source frame rate — also the muxer tick rate
  detect_fps: 8           # detector passes per second per camera

  # Cheap pre-filter: a static scene never reaches the GPU at all. This is also
  # what drives the dashboard's live/idle state per device — "idle" means the
  # gate below is currently skipping that stream, so no YOLO/ByteTrack runs.
  # Lower pixel_threshold / area_threshold = more sensitive (more frames pass).
  motion_gating: true
  motion:
    pixel_threshold: 18   # per-pixel intensity delta counted as change
    area_threshold: 0.002 # fraction of pixels that must change (0.2%)
    # The gate is only consulted on frames that already cleared the rate cap,
    # so these counts are in gate calls, not raw frames. At detect_fps 8,
    # force_every 8 means a static camera is still swept once per second.
    force_every: 8        # always detect at least this often, regardless
    hold_frames: 3        # keep the gate open briefly after motion stops

# ── Tracker (ByteTrack) ─────────────────────────────────────────────────────
# Tuned for CCTV: people walk behind pillars / vehicles, so tracks must coast
# a good while before being dropped. frame_rate is taken from model.detect_fps.
tracker:
  activation_conf:     0.25   # a detection must clear this to (re)start a track
  lost_buffer_frames:  60     # keep a lost track alive this many detection frames (~7 s at 8 fps)
  match_thresh:        0.85   # IoU-distance match gate (higher = stricter re-association)

# ── ANPR — number-plate recognition ─────────────────────────────────────────
# Two-stage: a YOLOv8 plate detector (models/license_plate_detector.pt, MIT,
# github.com/anindya-mukhopadhyay/ANPR) runs on each vehicle crop, then EasyOCR
# reads it on a background thread. Needs:  pip install easyocr
# If easyocr or the weights are missing the engine disables itself with a
# warning — the rest of the pipeline is unaffected. See docs/ANPR.md.
anpr:
  enabled: true
  weights: "models/license_plate_detector.pt"
  region: "IN"            # plate-format check: IN = Indian (SS RR L(L)(L) NNNN). "XX" = generic.
  yolo_conf: 0.30         # plate-detector confidence
  ocr_min_conf: 0.20      # min mean OCR confidence to log a plate to data/plates/plates.csv
  min_plate_area: 300     # px² — ignore specks
  plate_detect_every: 3   # run the plate detector every Nth detection tick (~2.7 fps)
  plate_imgsz: 320        # plate-detector input size (plates are small → small + fast)
  cooldown_s: 8           # don't re-log the same plate string within this window
  workers: 1              # EasyOCR worker threads (1 is plenty for a few vehicles)

# ── Pose / skeleton anomaly detection ────────────────────────────────────────
# Runs yolo26n-pose.pt on person bounding-box crops after the detection pass.
# Set enabled: false to disable without touching any Python code.
pose:
  enabled: true
  weights: "yolo26n-pose.pt"   # auto-downloaded by Ultralytics on first run (~6.5 MB)
  kp_conf: 0.5                 # joints below this visibility score are ignored
  # Geometry thresholds — tune per deployment environment
  lying_ratio:    0.35   # skeleton height/width ratio below this → lying
  crouch_ratio:   0.60   # body height < 60% of standing baseline → crouching
  knee_hip_delta: 30     # px: knee within this of hip.y → crouching
  scan_window:    10     # frames of nose_x history for vigorous-scan detection
  scan_std:       12.0   # px std-dev of nose_x to flag vigorous scan
  arms_up_margin: 20     # px wrist must be above shoulder line to count as raised
  # Rule 5 — weapon-ready posture (2D-skeleton heuristic, NOT gun detection).
  # A detected AIM forces the risk level to Critical (see risk_engine). Tuned to
  # catch a real two-handed gun hold; loosen if aim stances are missed, tighten
  # if innocent two-handed poses (phone, mug) trip it. See src/posture.py Rule 5.
  aim_band_above:     0.60   # wrist band top    = 0.60 * body-height above the shoulder line (≈ forehead)
  aim_band_below:     0.55   # wrist band bottom = 0.55 * body-height below the shoulder line (≈ navel)
  aim_wrist_sep:      0.85   # hands within 0.85 * shoulder-width of each other
  aim_wrist_level:    0.60   # hands within 0.60 * shoulder-width of the same height
  aim_center_margin:  0.55   # hands within 0.55 * shoulder-width of the shoulder span (in front of the torso)
  aim_wrist_above_hip: 0.10  # each hand at least 0.10 * body-height above the hip (arms off the thighs)
  aim_hold_frames:    2      # raw geometry must persist this many detection frames before AIM fires


# ── Risk scoring ──────────────────────────────────────────────────────────────
risk:
  threshold_critical: 70
  threshold_high: 50
  weights:
    zone: 0.40
    time_of_day: 0.20
    behaviour: 0.40

# ── Display ───────────────────────────────────────────────────────────────────
display:
  grid_cols: 3            # max columns in the multi-stream grid
  cell_width: 640         # each stream cell width in pixels
  cell_height: 360        # each stream cell height in pixels

# ── Evidence / storage ────────────────────────────────────────────────────────
evidence:
  db_path: "data/events.db"
  hash_chain_path: "data/hash_chain.jsonl"
  log_level: "High"       # log events at this level and above ("High" or "Critical")
